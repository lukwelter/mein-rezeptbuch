<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mein Rezeptbuch</title>

<style>
:root {
  --green: #285c43;
  --green-dark: #1e4533;
  --green-light: #e9f1e9;
  --background: #f6f8f4;
  --white: #ffffff;
  --text: #26382d;
  --muted: #748176;
  --border: #e3e9e2;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: system-ui, -apple-system, sans-serif;
  background: var(--background);
  color: var(--text);
}

button, input { font: inherit; }

button {
  border: none;
  cursor: pointer;
  border-radius: 12px;
  padding: 12px 18px;
  font-weight: 600;
  background: var(--green);
  color: white;
  transition: background .2s, transform .2s;
}

button:hover { background: var(--green-dark); }
button:active { transform: scale(.98); }
button:disabled { opacity: .5; cursor: wait; }

.secondary {
  background: var(--green-light);
  color: var(--green);
}

.secondary:hover { background: #dce9dc; }

.danger { background: #b94d4d; }
.danger:hover { background: #a43838; }

input {
  width: 100%;
  padding: 14px;
  border: 1px solid var(--border);
  border-radius: 12px;
  outline: none;
  background: white;
  color: var(--text);
  font-size: 16px;
}

input:focus {
  border-color: var(--green);
  box-shadow: 0 0 0 3px #285c431a;
}

.hidden { display: none !important; }

header {
  background: white;
  border-bottom: 1px solid var(--border);
  padding: 22px 20px;
}

.header-inner {
  max-width: 1000px;
  margin: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
}

.logo {
  font-size: 25px;
  font-weight: 750;
  color: var(--green);
  letter-spacing: -.7px;
}

.subtitle {
  color: var(--muted);
  font-size: 13px;
  margin-top: 5px;
}

main {
  max-width: 1000px;
  margin: 35px auto;
  padding: 0 18px 60px;
}

.card {
  background: white;
  padding: 28px;
  border-radius: 20px;
  border: 1px solid var(--border);
  box-shadow: 0 6px 25px #203a2910;
}

h2 {
  font-size: 23px;
  letter-spacing: -.5px;
  margin: 0 0 22px;
}

h3 { font-size: 17px; margin-top: 25px; }

#login {
  max-width: 420px;
  margin: 65px auto;
}

#login input { margin-bottom: 14px; }
#login button { width: 100%; margin-top: 8px; }

.toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 24px;
}

.toolbar h2 { margin: 0; }

#search {
  margin-bottom: 22px;
  background: #fbfcfa;
}

.recipe {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 18px;
  margin-bottom: 10px;
  border-radius: 13px;
  background: #f7faf6;
  border: 1px solid var(--border);
  cursor: pointer;
  transition: background .2s;
}

.recipe:hover { background: var(--green-light); }

.recipe-name {
  font-weight: 600;
  overflow-wrap: anywhere;
}

.arrow { color: var(--green); font-size: 22px; }

.ingredient-list {
  list-style: none;
  padding: 0;
  margin: 0 0 25px;
}

.ingredient-list li {
  display: flex;
  align-items: center;
  gap: 15px;
  padding: 15px 5px;
  border-bottom: 1px solid var(--border);
}

.amount-badge {
  min-width: 95px;
  max-width: 45%;
  padding: 8px 10px;
  border-radius: 9px;
  background: var(--green-light);
  color: var(--green);
  font-weight: 650;
  text-align: center;
  overflow-wrap: anywhere;
}

.ingredient-name { overflow-wrap: anywhere; }

.ingredient-row {
  display: grid;
  grid-template-columns: 1fr 2fr auto;
  gap: 10px;
  margin-bottom: 12px;
}

.ingredient-row button { padding: 12px 15px; }

.actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 24px;
}

#recipeName { margin-bottom: 12px; }

#message {
  margin: 18px 0;
  color: var(--green);
  font-weight: 500;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.empty {
  color: var(--muted);
  text-align: center;
  padding: 30px 0;
}

@media (max-width: 600px) {
  header { padding: 18px 15px; }
  .logo { font-size: 21px; }
  .subtitle { font-size: 11px; }
  main { margin-top: 20px; padding: 0 12px 45px; }
  .card { padding: 20px 16px; border-radius: 16px; }
  .toolbar { align-items: flex-start; flex-direction: column; }
  .toolbar button { width: 100%; }
  .ingredient-row {
    grid-template-columns: 95px minmax(0,1fr) auto;
    gap: 6px;
  }
  .ingredient-row button { padding: 10px; }
  .actions button { flex: 1; }
  .amount-badge { min-width: 75px; }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <div>
      <div class="logo">Rezeptbuch</div>
      <div class="subtitle">˚ ༘✶ ⋆｡˚ ⁀➷</div>
    </div>
    <button id="logout" class="secondary hidden">Abmelden</button>
  </div>
</header>

<main>

<section id="login" class="card">
  <h2>Willkommen zurück</h2>
  <form id="loginForm">
    <input id="email" type="email"
      placeholder="E-Mail-Adresse"
      autocomplete="username" required>
    <input id="password" type="password"
      placeholder="Passwort"
      autocomplete="current-password" required>
    <button type="submit">Anmelden</button>
  </form>
</section>

<section id="app" class="hidden">

  <div id="listPanel" class="card">
    <div class="toolbar">
      <h2>Meine Rezepte</h2>
      <button id="newRecipe">+ Neues Rezept</button>
    </div>
    <input id="search" placeholder="Rezept suchen ...">
    <div id="recipeList"></div>
  </div>

  <div id="detailPanel" class="card hidden">
    <h2 id="detailTitle"></h2>
    <ul id="detailIngredients" class="ingredient-list"></ul>
    <div class="actions">
      <button id="editRecipe">Bearbeiten</button>
      <button id="deleteRecipe" class="danger">Löschen</button>
      <button id="backDetail" class="secondary">Zurück</button>
    </div>
  </div>

  <div id="editorPanel" class="card hidden">
    <h2 id="editorTitle">Neues Rezept</h2>
    <form id="recipeForm">
      <input id="recipeName"
        placeholder="Rezeptname"
        maxlength="160" required>
      <h3>Zutaten und Mengen</h3>
      <div id="ingredientRows"></div>
      <button id="addIngredient"
        type="button" class="secondary">
        + Zutat hinzufügen
      </button>
      <div class="actions">
        <button id="saveRecipe" type="submit">
          Rezept speichern
        </button>
        <button id="cancelEdit"
          type="button" class="secondary">
          Abbrechen
        </button>
      </div>
    </form>
  </div>

</section>

<p id="message" role="status" aria-live="polite"></p>

</main>

<script type="module">
import { createClient } from
  'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

// Deine Supabase-Verbindung
const SUPABASE_URL = 'https://yrysdxoygtedkrpmhgnq.supabase.co';
const SUPABASE_KEY = 'sb_publishable_3h5nPlkDq1JUWlv4qC6CiQ_mV5qqk_f';

const $ = id => document.getElementById(id);

const db = createClient(SUPABASE_URL, SUPABASE_KEY);

let recipes = [];
let selected = null;
let editing = null;
let user = null;

function message(text) {
  $('message').textContent = text;
}

function panel(id) {
  for (const name of [
    'listPanel', 'detailPanel', 'editorPanel'
  ]) {
    $(name).classList.toggle('hidden', name !== id);
  }
}

function addRow(menge = '', zutat = '') {
  const row = document.createElement('div');
  row.className = 'ingredient-row';

  const amount = document.createElement('input');
  amount.className = 'amount';
  amount.placeholder = '200 g';
  amount.value = menge;
  amount.setAttribute('aria-label', 'Menge');

  const item = document.createElement('input');
  item.className = 'item';
  item.placeholder = 'Zutat';
  item.value = zutat;
  item.setAttribute('aria-label', 'Zutat');

  const remove = document.createElement('button');
  remove.type = 'button';
  remove.className = 'secondary';
  remove.textContent = '×';
  remove.setAttribute('aria-label', 'Zutat entfernen');
  remove.onclick = () => row.remove();

  row.append(amount, item, remove);
  $('ingredientRows').append(row);
}

function ingredients() {
  return [...$('ingredientRows').children]
    .map(row => ({
      menge: row.querySelector('.amount').value.trim(),
      zutat: row.querySelector('.item').value.trim()
    }))
    .filter(x => x.zutat);
}

async function load() {
  const { data, error } = await db
    .from('rezepte')
    .select('id,name,zutaten')
    .order('name');

  if (error) throw error;

  recipes = data || [];
  render();
}

function render() {
  const q = $('search').value.toLocaleLowerCase('de');
  $('recipeList').replaceChildren();

  const matches = recipes.filter(r =>
    r.name.toLocaleLowerCase('de').includes(q)
  );

  if (!matches.length) {
    const empty = document.createElement('p');
    empty.className = 'empty';
    empty.textContent = q
      ? 'Keine passenden Rezepte gefunden.'
      : 'Noch keine Rezepte vorhanden.';
    $('recipeList').append(empty);
    return;
  }

  for (const r of matches) {
    const div = document.createElement('div');
    div.className = 'recipe';
    div.tabIndex = 0;
    div.setAttribute('role', 'button');

    const name = document.createElement('span');
    name.className = 'recipe-name';
    name.textContent = r.name;

    const arrow = document.createElement('span');
    arrow.className = 'arrow';
    arrow.textContent = '›';

    div.append(name, arrow);
    div.onclick = () => detail(r.id);
    div.onkeydown = e => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        detail(r.id);
      }
    };
    $('recipeList').append(div);
  }
}

function detail(id) {
  selected = id;
  const r = recipes.find(x => x.id === id);
  if (!r) return;

  $('detailTitle').textContent = r.name;
  $('detailIngredients').replaceChildren();

  for (const z of (Array.isArray(r.zutaten)
    ? r.zutaten : [])) {
    const li = document.createElement('li');

    const amount = document.createElement('span');
    amount.className = 'amount-badge';
    amount.textContent = z.menge || '–';

    const name = document.createElement('span');
    name.className = 'ingredient-name';
    name.textContent = z.zutat || '';

    li.append(amount, name);
    $('detailIngredients').append(li);
  }

  panel('detailPanel');
  message('');
}

function editor(id = null) {
  editing = id;
  const r = recipes.find(x => x.id === id);

  $('editorTitle').textContent = r
    ? 'Rezept bearbeiten'
    : 'Neues Rezept';

  $('recipeName').value = r?.name || '';
  $('ingredientRows').replaceChildren();

  if (Array.isArray(r?.zutaten) && r.zutaten.length) {
    r.zutaten.forEach(z =>
      addRow(z.menge || '', z.zutat || '')
    );
  } else {
    addRow();
  }

  panel('editorPanel');
  message('');
}

$('addIngredient').onclick = () => addRow();
$('newRecipe').onclick = () => editor();
$('editRecipe').onclick = () => editor(selected);
$('backDetail').onclick = () => panel('listPanel');
$('cancelEdit').onclick = () => panel('listPanel');
$('search').oninput = render;

$('recipeForm').onsubmit = async e => {
  e.preventDefault();

  const name = $('recipeName').value.trim();
  const zutaten = ingredients();

  if (!name || !zutaten.length) {
    message('Bitte Rezeptname und Zutaten eingeben.');
    return;
  }

  const saveButton = $('saveRecipe');
  saveButton.disabled = true;

  try {
    const payload = { name, zutaten };

    const result = editing
      ? await db.from('rezepte')
          .update(payload)
          .eq('id', editing)
          .eq('benutzer_id', user.id)
          .select()
      : await db.from('rezepte')
          .insert({ ...payload, benutzer_id: user.id })
          .select();

    if (result.error) throw result.error;
    if (!result.data?.length) {
      throw new Error('Rezept konnte nicht gespeichert werden.');
    }

    await load();
    panel('listPanel');
    message('Rezept erfolgreich gespeichert.');
  } catch (err) {
    message('Fehler: ' + err.message);
  } finally {
    saveButton.disabled = false;
  }
};

$('deleteRecipe').onclick = async () => {
  const r = recipes.find(x => x.id === selected);
  if (!r || !confirm('Rezept wirklich löschen?')) return;

  try {
    const { data, error } = await db
      .from('rezepte')
      .delete()
      .eq('id', selected)
      .eq('benutzer_id', user.id)
      .select();

    if (error) throw error;
    if (!data?.length) {
      throw new Error('Rezept konnte nicht gelöscht werden.');
    }

    await load();
    panel('listPanel');
    message('Rezept gelöscht.');
  } catch (err) {
    message('Fehler: ' + err.message);
  }
};

$('loginForm').onsubmit = async e => {
  e.preventDefault();

  const button = e.submitter;
  button.disabled = true;

  try {
    const { error } = await db.auth.signInWithPassword({
      email: $('email').value.trim(),
      password: $('password').value
    });

    if (error) throw error;

    $('password').value = '';
    await initialize();
  } catch (err) {
    message('Anmeldung fehlgeschlagen: ' + err.message);
  } finally {
    button.disabled = false;
  }
};

$('logout').onclick = async () => {
  const { error } = await db.auth.signOut();

  if (error) {
    message('Abmelden fehlgeschlagen: ' + error.message);
    return;
  }

  user = null;
  recipes = [];

  $('app').classList.add('hidden');
  $('logout').classList.add('hidden');
  $('login').classList.remove('hidden');
  message('Abgemeldet.');
};

async function initialize() {
  const { data: { user: current }, error } =
    await db.auth.getUser();

  if (error || !current) {
    user = null;
    $('app').classList.add('hidden');
    $('logout').classList.add('hidden');
    $('login').classList.remove('hidden');
    return;
  }

  user = current;
  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('logout').classList.remove('hidden');
  panel('listPanel');

  try {
    await load();
    message('');
  } catch (err) {
    message('Fehler beim Laden: ' + err.message);
  }
}

initialize();
</script>
</body>
</html>
